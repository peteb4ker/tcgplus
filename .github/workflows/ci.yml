name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open('manifest.json'))
          assert m.get('manifest_version') == 3, f"expected manifest_version 3, got {m.get('manifest_version')}"
          for f in ['name', 'version', 'description']:
              assert m.get(f), f"manifest missing required field: {f}"
          for f in m.get('content_scripts', [{}])[0].get('js', []) + m.get('content_scripts', [{}])[0].get('css', []):
              assert __import__('os').path.exists(f), f"content script file missing: {f}"
          print("manifest.json OK")
          PY

      - name: Check JS syntax
        run: node --check content.js
