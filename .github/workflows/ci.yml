name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest.json
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open('manifest.json'))
          assert m.get('manifest_version') == 3, f"expected manifest_version 3, got {m.get('manifest_version')}"
          for f in ['name', 'version', 'description']:
              assert m.get(f), f"manifest missing required field: {f}"
          def must_exist(f, what):
              assert f, f"manifest missing {what}"
              assert os.path.isfile(f), f"{what} file missing: {f}"
          for cs in m.get('content_scripts', []):
              for f in cs.get('js', []) + cs.get('css', []):
                  must_exist(f, 'content script')
          must_exist(m.get('background', {}).get('service_worker'), 'background.service_worker')
          must_exist(m.get('options_page'), 'options_page')
          icons = m.get('icons', {})
          assert icons, "manifest missing icons"
          for size, f in icons.items():
              must_exist(f, f"icons[{size}]")
          action_icons = m.get('action', {}).get('default_icon', {})
          assert action_icons, "manifest missing action.default_icon"
          if isinstance(action_icons, str):
              action_icons = {'default': action_icons}
          for size, f in action_icons.items():
              must_exist(f, f"action.default_icon[{size}]")
          print("manifest.json OK")
          PY

      - name: Check JS syntax
        run: |
          for f in content.js lib.js storage.js background.js options/options.js; do
            node --check "$f"
          done

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc --checkJs)
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
