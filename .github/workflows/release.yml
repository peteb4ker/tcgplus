name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)publish (e.g. v0.4.0). Must already exist on the repo.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Hoist the secrets to job-level env so the per-step `if:` can check
      # them without referencing `secrets.*` directly (GitHub Actions doesn't
      # allow that in conditionals).
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      # Resolve the target tag from either trigger. Tag-push sets
      # `github.ref_name` to the tag; workflow_dispatch carries it as an
      # input. Both downstream steps read $TAG so they don't have to care
      # which trigger fired.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          # `ref` defaults to the branch for workflow_dispatch, which is
          # wrong for a tag (re-)publish — we want the source tree as of
          # that tag. For tag-push triggers the input is empty and
          # checkout falls back to GITHUB_REF, which IS the tag, so the
          # behavior is unchanged for the happy path.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build extension zip
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ZIP="tcgplus-${VERSION}.zip"
          # Bundle only the files the extension actually loads at runtime.
          # icons/icon.svg is build-time-only (used by tools/render-promo-tile.js)
          # and would just bloat the zip + draw reviewer questions.
          zip -r "$ZIP" \
            manifest.json \
            lib.js storage.js content.js content.css background.js \
            icons options \
            README.md LICENSE \
            -x "icons/icon.svg"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Check if GitHub Release already exists
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists; skipping create-release step. The Chrome Web Store publish will still run."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        # softprops/action-gh-release@v3 marks the release immutable. On a
        # rerun (e.g. after a transient Chrome Web Store failure) trying to
        # re-upload the same asset fails with "Cannot delete asset from an
        # immutable release". Skip the step entirely when the release for
        # this tag already exists — the zip got attached on the first run
        # and the only thing left to do is the CWS publish below. See #78.
        if: steps.rel.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ZIP }}
          generate_release_notes: true

      - name: Publish to Chrome Web Store
        if: env.CWS_EXTENSION_ID != ''
        env:
          # The chrome-webstore-upload-cli reads these env-var names by
          # default, so we re-export under the names it expects.
          EXTENSION_ID: ${{ env.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ env.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ env.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ env.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          npx -y chrome-webstore-upload-cli@3 upload \
            --source "$ZIP" \
            --auto-publish

      - name: Skip Web Store publish (secrets not configured)
        if: env.CWS_EXTENSION_ID == ''
        run: |
          set -euo pipefail
          echo "::notice::CWS_EXTENSION_ID not set; skipping Chrome Web Store publish step."
          echo "Add CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN to repo Actions secrets to enable auto-publish."
