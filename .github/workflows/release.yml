name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build extension zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="tcgplus-${VERSION}.zip"
          zip -r "$ZIP" manifest.json lib.js storage.js content.js content.css background.js icons options README.md LICENSE
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
